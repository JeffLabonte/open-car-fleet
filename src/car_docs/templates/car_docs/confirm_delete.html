{% extends 'shop/index.html' %}

{% block content %}
  <div class="box">
    <h1 class="title">Delete document</h1>
    <div class="notification is-warning">
      Are you sure you want to delete <strong>{{ doc.title }}</strong> for {{ car.usual_name|default:car.make }}?
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="field is-grouped">
        <div class="control">
          <button class="button is-danger" type="submit">Delete</button>
        </div>
        <div class="control">
          <a class="button is-light" href="{% url 'shop-car-doc-detail' car.pk doc.pk %}">Cancel</a>
        </div>
      </div>
    </form>
  </div>
{% endblock %}
