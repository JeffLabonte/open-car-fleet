<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ title|default:'My App' }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  </head>
  <body>
    <section class="hero is-light">
      <div class="hero-body">
        <div class="container">
          <h1 class="title">{{ title|default:'My App' }}</h1>
          <h2 class="subtitle">{{ subtitle|default:'A flexible Bulma-powered interface' }}</h2>
        </div>
      </div>
    </section>

    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="container">
        <div class="navbar-brand">
          <a class="navbar-item" href="{% url 'shop-index' %}">
            {{ brand_name|default:'App' }}
          </a>
          <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </a>
        </div>

        <div id="navbarMenu" class="navbar-menu">
          <div class="navbar-start">
            <a class="navbar-item" href="{% url 'shop-index' %}">Home</a>
            <a class="navbar-item" href="{% url 'shop-car-list' %}">Cars</a>
            <a class="navbar-item" href="{% url 'shop-car-create' %}">Add Car</a>
          </div>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        {% if messages %}
          {% for message in messages %}
            <div class="notification {% if message.tags %}is-{{ message.tags }}{% else %}is-info{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        {% block content %}
          <div class="box">
            <p>Welcome to the shop app.</p>
          </div>
        {% endblock %}
      </div>
    </section>
  </body>
</html>
