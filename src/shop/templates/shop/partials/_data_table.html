{% load i18n %}
<div class="table-container">
  <div class="table-wrap">
    <table class="table is-fullwidth is-striped is-hoverable table--responsive">
      <thead>
        <tr>
          {% for header in headers %}
            <th scope="col">{{ header }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr>
            {% for cell in row %}
              <td>{{ cell }}</td>
            {% endfor %}
          </tr>
        {% empty %}
          <tr>
            <td colspan="{{ headers|length }}" class="has-text-centered has-text-grey">{% translate 'No records.' %}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
