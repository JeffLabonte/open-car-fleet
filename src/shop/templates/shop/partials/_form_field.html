<div class="field {% if field.field.widget.input_type == 'textarea' or field.field.widget.input_type == 'file' %}field--full{% endif %}" data-testid="form-field-{{ field.name }}">
  {{ field.label_tag }}
  <div class="control">
    {{ field }}
  </div>
  {% if field.help_text %}
    <p class="help">{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p class="help is-danger">{{ error }}</p>
  {% endfor %}
</div>
