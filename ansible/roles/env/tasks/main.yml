---
- name: Require Vault for production deployment
  ansible.builtin.shell: |
    awk -F= '$1 == "SECRETS_BACKEND" {value = $2} END {exit value != "vault"}' "{{ playbook_dir }}/../{{ env_file }}"
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Require DEBUG=False for production deployment
  ansible.builtin.shell: |
    awk -F= '$1 == "DEBUG" {value = $2} END {exit value != "False"}' "{{ playbook_dir }}/../{{ env_file }}"
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Upload production env file to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ env_file }}"
    dest: "{{ app_dir }}/src/.env"
    owner: root
    group: root
    # Docker Compose reads env_file values through the daemon, so the container
    # user does not need direct access. Restrict to root to protect secrets.
    mode: '0600'
  no_log: true

- name: Derive database-only env file from deployed env
  ansible.builtin.shell: |
    set -euo pipefail
    grep -E '^POSTGRES_' "{{ app_dir }}/src/.env" > "{{ app_dir }}/src/.env.database"
    chmod 600 "{{ app_dir }}/src/.env.database"
  args:
    executable: /bin/bash
  # Always regenerate so password rotations in src/.env propagate to the DB container.
  changed_when: true
