name: Test Suite

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: fedora:44@sha256:b189269dfee735c54ebcd3b4e43ff2dc0d4a4b07855468970217c9df57968eb0 # 44

    steps:
      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y \
            ca-certificates \
            curl \
            git \
            make \
            python3 \
            python3-pip \
            python3-virtualenv
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Poetry
        run: "python3 -m pip install --no-cache-dir --only-binary :all: poetry==2.5.1"

      - name: Configure Poetry to prefer wheels
        run: poetry config installer.no-binary false

      - name: Install project dependencies
        run: poetry install --no-interaction --no-ansi --no-root --with test

      - name: Run linter
        run: make lint

      - name: Check formatting
        run: make format-check

  test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44@sha256:b189269dfee735c54ebcd3b4e43ff2dc0d4a4b07855468970217c9df57968eb0 # 44

    steps:
      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y \
            ca-certificates \
            curl \
            git \
            python3 \
            python3-pip \
            python3-virtualenv
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Poetry
        run: "python3 -m pip install --no-cache-dir --only-binary :all: poetry==2.5.1"

      - name: Configure Poetry to prefer wheels
        run: poetry config installer.no-binary false

      - name: Install project dependencies
        run: poetry install --no-interaction --no-ansi --no-root --with test

      - name: Guard against missing model migrations
        run: poetry run python src/manage.py makemigrations --check --no-input
        env:
          DEBUG: "True"
          DJANGO_SECRET_KEY: ci-only-migration-check-secret

      - name: Run tests
        run: poetry run pytest -q --cov --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage
        run: |
           if [ -z "${CODECOV_TOKEN}" ]; then
             echo "CODECOV_TOKEN not available; skipping coverage upload."
             exit 0
           fi
           poetry run codecovcli do-upload --git-service github --report-type test_results --file junit.xml && \
           poetry run codecovcli upload-process --git-service github --file junit.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-e2e-secret-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1 localhost
      POSTGRES_DB: ""
      HANKO_API_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: latest

      - name: Install Poetry
        run: "python -m pip install --upgrade --only-binary :all: poetry==2.5.1"

      - name: Configure Poetry to prefer wheels
        run: poetry config installer.no-binary false

      - name: Run Firefox E2E suite
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: make test-e2e
