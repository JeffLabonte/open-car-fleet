name: Test Suite

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y \
            ca-certificates \
            curl \
            git \
            python3 \
            python3-pip \
            python3-virtualenv
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Poetry
        run: python3 -m pip install --no-cache-dir poetry

      - name: Install project dependencies
        run: poetry install --no-interaction --no-ansi --no-root --with test

      - name: Run tests
        run: poetry run pytest -q

  e2e:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-e2e-secret-key
      DJANGO_ALLOWED_HOSTS: 127.0.0.1 localhost
      POSTGRES_DB: ""
      HANKO_API_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install Poetry
        run: python -m pip install --upgrade poetry

      - name: Run Firefox E2E suite
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: make test-e2e
