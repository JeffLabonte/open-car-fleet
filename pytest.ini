[pytest]
DJANGO_SETTINGS_MODULE = settings.settings
pythonpath = src
testpaths = src tests/bdd
python_files = tests.py test_*.py *_test.py
env =
    DEBUG = True
    DJANGO_SECRET_KEY = pytest-only-secret-key
    DJANGO_ALLOWED_HOSTS = testserver localhost 127.0.0.1 [::1]
    POSTGRES_DB =
    POSTGRES_USER =
    POSTGRES_PASSWORD =
    POSTGRES_HOST =
    POSTGRES_PORT =
