services:
  db:
    image: docker.io/library/postgres:17
    env_file:
      - ./src/.env.database
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - open-car-fleet-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-open_garage_user} -d ${POSTGRES_DB:-open_garage}']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  cache:
    image: docker.io/library/redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - open-car-fleet-network
    volumes:
      - cache_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/src
    command: gunicorn --chdir /app/src settings.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      - PYTHONPATH=/app/src
      - DJANGO_STATIC_ROOT=/staticfiles
      - RATELIMIT_CACHE_URL=redis://cache:6379/0
    env_file:
      - ./src/.env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - '8000:8000'
    volumes:
      - media_volume:/app/src/media
      - /dev/log:/dev/log
    networks:
      - open-car-fleet-network

volumes:
  postgres_data:
  media_volume:
  cache_data:

networks:
  # No explicit driver so this works with Docker (defaults to bridge)
  # and rootless Podman (uses its default network mode).
  open-car-fleet-network:
